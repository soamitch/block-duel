<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10141a">
<title>Block Duel Controller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone screen. Header with seat chip, a message block or a big swipe surface in the middle, and no buttons while playing, the whole area is a swipe surface. Single dark look. */
:root{
  --bg:#10141a; --panel:#18202a; --line:#2a3544; --fg:#e9edf2; --dim:#8996a8;
  --accent:#f2b134; --accent-ink:#1a1305; --danger:#ea5a5f; --good:#46d695;
  --p1:#4cc9f0; --p2:#f2b134; --board:#0b0f14; --gridline:#18202a; --scrim:rgba(10,13,18,.86);
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'Spline Sans Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 var(--font-ui); overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100%; display:flex; flex-direction:column; gap:12px; max-width:560px; margin:0 auto;
  padding-top:max(12px,env(safe-area-inset-top,0px)); padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex; justify-content:space-between; align-items:center; gap:12px; flex:none}
.chip{display:flex; align-items:center; gap:10px; font:800 22px/1 var(--font-display); letter-spacing:.06em; text-transform:uppercase}
.chip i{width:10px; height:22px; border-radius:3px; background:var(--c,var(--dim))}
.net{font:600 12px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); display:flex; gap:6px; align-items:center}
.net i{width:8px; height:8px; border-radius:50%; background:var(--danger); display:inline-block}
.net.on i{background:var(--good)}
main{flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; overflow-y:auto}
.msg{display:flex; flex-direction:column; gap:8px; padding-top:8vh}
.msg h1{margin:0; font:900 44px/1 var(--font-display); text-transform:uppercase; letter-spacing:.02em; text-wrap:balance}
.msg p{margin:0; color:var(--dim); font-size:16px; max-width:34ch}
.actions{display:flex; flex-direction:column; gap:10px; margin-top:auto}
.btn{min-height:64px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:700 18px var(--font-ui); touch-action:manipulation}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.small{min-height:48px; font-size:15px; color:var(--dim)}
.cpu{display:flex; flex-direction:column; gap:8px}
.cpu .lbl{font:600 12px var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.cpu div{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.cpu .btn{color:var(--fg)}
.opt{display:grid; grid-template-columns:64px repeat(var(--n,2),1fr); gap:8px; align-items:center}
.opt .lbl{font:600 12px var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.opt .btn.small{min-height:44px}
.opt .btn[aria-pressed="true"]{color:var(--fg); border-color:var(--c,var(--accent)); background:var(--line)}
.opt input[type=range]{width:100%; height:44px; margin:0; accent-color:var(--c,var(--accent)); touch-action:pan-x}
.opt output{font:600 13px var(--font-mono); color:var(--fg); text-align:right; min-width:5.5em}
.rules-note{margin:0; color:var(--dim); font-size:14px}
.btn:active{filter:brightness(.9)}
.btn:focus-visible,.key:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#surface{flex:1; min-height:0; border:1px solid var(--line); border-radius:14px; background:var(--panel); touch-action:none; position:relative; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center}
#surface.touch{border-color:var(--c,var(--accent))}
.hint{color:var(--dim); font-size:15px; max-width:26ch; pointer-events:none}
#surface.local{padding:8px}
#local{display:flex; gap:10px; align-items:flex-start; justify-content:center; width:100%; position:relative; pointer-events:none}
#local canvas{display:block; border-radius:6px; background:var(--board); border:1px solid var(--line)}
.rail{display:flex; flex-direction:column; gap:5px; width:84px; text-align:left}
.rail .lbl{font:600 11px var(--font-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:4px}
.rail .st{display:flex; justify-content:space-between; align-items:baseline; margin-top:4px}
.rail b{font:600 16px var(--font-mono); color:var(--fg)}
#cdNum{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:900 120px var(--font-display); color:var(--accent); text-shadow:0 2px 0 var(--bg)}
.hud{font:600 15px var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:.06em; display:flex; gap:14px; align-items:center}
.hud .low{color:var(--danger)}
#flash{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:900 64px var(--font-display); text-transform:uppercase; letter-spacing:.04em; color:var(--c,var(--accent)); opacity:0; pointer-events:none}
#flash.show{opacity:.9; transition:none}
#flash.fade{opacity:0; transition:opacity .25s}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="chip" id="chip"><i></i><span id="chipTxt">Connecting</span></div>
    <div class="hud" id="hud" hidden></div>
    <div class="net" id="net"><i></i><span id="netTxt">Offline</span></div>
  </header>
  <main>
    <div class="msg" id="msg">
      <h1 id="title">Connecting</h1>
      <p id="sub"></p>
    </div>
    <div class="actions" id="actions" hidden>
      <div class="opt" id="screenRow">
        <span class="lbl">Screen</span>
        <button class="btn small" data-screen="tv" aria-pressed="false">TV</button><button class="btn small" data-screen="phone" aria-pressed="false">Phones</button>
      </div>
      <div class="opt" id="rulesRow">
        <span class="lbl">Rules</span>
        <button class="btn small" data-rules="ko" aria-pressed="false">KO</button><button class="btn small" data-rules="classic" aria-pressed="false">Classic</button>
      </div>
      <div class="opt" id="timeRow" style="--n:4">
        <span class="lbl">Time</span>
        <button class="btn small" data-min="2">2 min</button><button class="btn small" data-min="3">3 min</button><button class="btn small" data-min="5">5 min</button><button class="btn small" data-min="0">None</button>
      </div>
      <p class="rules-note" id="rulesNote"></p>
      <div class="opt" id="soundRow">
        <span class="lbl">Sound</span>
        <button class="btn small" data-sound="1" aria-pressed="false">On</button><button class="btn small" data-sound="0" aria-pressed="false">Off</button>
      </div>
      <p class="rules-note" id="soundNote" hidden></p>
      <div class="opt" id="swipeRow" style="grid-template-columns:64px 1fr auto">
        <label class="lbl" for="sens">Swipe</label>
        <input type="range" id="sens" min="1" max="5" step="1" value="3" aria-describedby="sensTxt">
        <output id="sensTxt" for="sens"></output>
      </div>
      <button class="btn primary" id="readyBtn">Ready</button>
      <div class="cpu" id="cpuRow" hidden>
        <span class="lbl">Play the computer</span>
        <div><button class="btn small" data-cpu="easy">Easy</button><button class="btn small" data-cpu="normal">Normal</button><button class="btn small" data-cpu="hard">Hard</button></div>
      </div>
      <button class="btn small" id="soloBtn" hidden>Play on my own</button>
    </div>
    <div id="surface" hidden>
      <div class="hint" id="surfHint">Drag sideways to move. Tap to rotate. Flick down to drop. Flick up to hold.</div>
      <div id="local" hidden>
        <canvas id="myBoard"></canvas>
        <div class="rail">
          <span class="lbl">Hold</span><canvas id="myHold"></canvas>
          <span class="lbl">Next</span><canvas id="myNext"></canvas>
          <div id="oppBox"><span class="lbl" id="oppName"></span><canvas id="oppBoard"></canvas></div>
          <div class="st"><span class="lbl">Lines</span><b id="myLines">0</b></div>
          <div class="st"><span class="lbl">Sent</span><b id="mySent">0</b></div>
        </div>
        <div id="cdNum" hidden></div>
      </div>
      <div id="flash"></div>
    </div>
  </main>
</div>

<script src="/game.js"></script>
<script>
(function(){
'use strict';
function $(s){return document.querySelector(s);}
var SEATCOL=['var(--p1)','var(--p2)'];
var ws=null, seat=-1, retry=0, noRetry=false, alive=false, wasLive=false;
var S={phase:'lobby',ready:[false,false],conn:[false,false],wins:[0,0],winner:null,solo:false,cpu:null,rules:'ko',koMin:3,kos:null};
var lastTv=S;                      /* latest state from the TV page */

/* a stable id so a refresh keeps the same seat */
var myId='';
try{myId=localStorage.getItem('bd-pad-id')||'';}catch(e){}
if(!myId){
  myId=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{localStorage.setItem('bd-pad-id',myId);}catch(e){}
}

function setNet(on){$('#net').className='net'+(on?' on':'');$('#netTxt').textContent=on?'Live':'Offline';}
/* Swipe sensitivity is kept per phone. Higher levels need shorter drags per step and gentler flicks. */
var SENS_LEVELS=[1.5,1.22,1,0.82,0.66], SENS_NAMES=['Lowest','Low','Normal','High','Highest'], sens=3;
try{var sv=+localStorage.getItem('bd-swipe');if(sv>=1&&sv<=5)sens=sv;}catch(e){}
function sensK(){return SENS_LEVELS[sens-1];}
var HAPTICS=true;
try{if(localStorage.getItem('bd-haptics')==='0')HAPTICS=false;}catch(e){}
/* Android has navigator.vibrate. iPhones do not, but recent iOS Safari ticks the haptic engine when a native switch control is toggled by a touch, so on those we click a hidden switch instead. It gives one light tick per call whatever the pattern. */
var TICK=null;
function makeTick(){
  var l=document.createElement('label');
  l.setAttribute('aria-hidden','true');
  l.style.cssText='position:fixed;left:-40px;top:-40px;width:20px;height:20px;opacity:.01;pointer-events:none;overflow:hidden';
  var i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch',''); i.tabIndex=-1;
  l.appendChild(i); document.body.appendChild(l); return l;
}
function vibe(ms){
  if(!HAPTICS)return;
  try{
    if(navigator.vibrate){navigator.vibrate(ms);return;}
    if(!TICK)TICK=makeTick();
    TICK.click();
  }catch(e){}
}

function connect(){
  clearTimeout(retry);
  if(noRetry)return;
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=function(){
    if(wasLive)SFX.reset();           /* a dropped connection usually means the phone slept; start audio afresh on the next tap */
    wasLive=true; alive=true; setNet(true); ws.send(JSON.stringify({t:'hello',role:'pad',id:myId})); render();
  };
  ws.onmessage=function(e){
    var m; try{m=JSON.parse(e.data);}catch(x){return;}
    if(m.t==='seat'){seat=m.seat;render();}
    else if(m.t==='tv'&&m.m){lastTv=m.m;render();}
    else if(m.t==='room')onRoom(m);
    else if(m.t==='p'&&m.m)onPeer(m.from,m.m);
    else if(m.t==='full'){noRetry=true;seat=-2;render();}
  };
  ws.onclose=function(ev){
    alive=false;setNet(false);
    room.seats=[null,null]; G=null; hostS=null;     /* a local practice or computer game keeps running offline */
    if(ev&&ev.code===4001){noRetry=true;seat=-3;}
    render();
    if(!noRetry)retry=setTimeout(connect,1000);
  };
  ws.onerror=function(){try{ws.close();}catch(x){}};
}
function sendMsg(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}
var BUZZ={L:8,R:8,D:5,U:12,C:[10,40,10],H:[28,30,16]};
/* in TV mode the phone plays the sound of each input itself; in phone mode the board on this phone makes all the sounds */
var KEY_SFX={L:'move',R:'move',U:'rotate',Z:'rotate',H:'hard',C:'hold'};
function key(k){
  vibe(BUZZ[k]||8);
  if(!phoneMode()){sendMsg({t:'in',k:k});if(KEY_SFX[k]&&S.phase==='playing')SFX.play(KEY_SFX[k],0);return;}
  var g=myGame(); if(g&&!g.over)g.apply(k);
}
function hint(txt){if(!phoneMode())flash(txt);}   /* the move names only show on the plain swipe pad, not over a board */

/* a KO shows on the swipe surface; the phone that got knocked out also buzzes */
function onKos(a,b){
  if(!a||!b||seat<0)return;
  var other=seat===0?1:0;
  if(b[other]>a[other]){flash('KO');vibe([60,40,60]);}
  else if(b[seat]>a[seat])flash('KO');
  else return;
  if(phoneMode())SFX.play('ko',0);
}

/* ---------------------------------------------------------- screens */
function show(el,on){el.hidden=!on;}
function render(){
  S=currentState();
  onKos(lastKos,S.kos); lastKos=S.kos;
  var c=seat===0||seat===1?SEATCOL[seat]:'var(--dim)';
  document.documentElement.style.setProperty('--c',c);
  $('#chipTxt').textContent=seat===0||seat===1?'Player '+(seat+1):'Block Duel';
  var title='', sub='', btn='', showReady=false, showSolo=false, playing=false;
  var other=seat===0?1:0;
  if(seat===-2){title='Both seats are taken';sub='Two phones are already connected. Close this page on one of them, then reload.';}
  else if(seat===-3){title='Seat taken';sub='This seat was taken by another browser on your phone. Close the other tab, then reload this page.';}
  else if(seat<0||!alive){title=alive?'Joining':'Reconnecting';sub='Make sure this phone is on the same Wi-Fi as the TV.';}
  else if((S.phase==='countdown'||S.phase==='playing')&&S.seats&&S.seats.indexOf(seat)<0){title='Match in progress';sub=S.cpu?'Player '+(other+1)+' is playing the computer. You can join when it ends.':'Player '+(other+1)+' is playing on their own. You can join when it ends.';}
  else if((S.phase==='countdown'||S.phase==='playing')&&S.cpu&&S.cpu.seat===seat){title='Match in progress';sub='Player '+(other+1)+' is playing the computer. You can join when it ends.';}
  else if(S.phase==='countdown'||S.phase==='playing'){playing=true;}
  else if(S.phase==='result'&&!(S.cpu&&S.cpu.seat===seat)&&!(S.seats&&S.seats.indexOf(seat)<0)){
    showReady=true; showSolo=false;
    if(S.solo){title='Game over';sub='Nice run.';btn='Play again';}
    else if(S.cpu&&S.cpu.seat!==seat){
      title=S.winner===seat?'You won':(S.winner===-1?'Draw':'You lost');
      sub='Wins: you '+S.wins[seat]+', computer '+S.wins[S.cpu.seat]+'.';
      btn=S.conn[other]?(S.ready[seat]?'Not ready':'Ready'):'Rematch'; showSolo=!S.conn[other];
      if(S.conn[other])sub+=' Player '+(other+1)+' has joined. Tap Ready to play them.';
    }
    else{
      title=S.winner===seat?'You won':(S.winner===-1?'Draw':'You lost');
      sub='Wins: you '+S.wins[seat]+', player '+(other+1)+' '+S.wins[other]+'.';
      btn=S.ready[seat]?'Not ready':'Rematch';
      if(S.ready[seat])sub+=' Waiting for player '+(other+1)+'.';
      if(!S.conn[other]){sub+=' Player '+(other+1)+' has left. You can play on your own.';showSolo=true;}
    }
  }else{
    showReady=true;
    var oc=S.conn[other], mine=S.ready[seat];
    if(!oc){title='Waiting for player '+(other+1);sub='Open this page on the other phone, or play the computer or a practice run.';showSolo=true;}
    else if(mine){title='Waiting for player '+(other+1);sub='You are ready.';}
    else{title='Ready?';sub=S.ready[other]?'Player '+(other+1)+' is ready.':'Tap Ready when you are set.';}
    btn=mine?'Not ready':'Ready';
  }
  $('#title').textContent=title; $('#sub').textContent=sub;
  show($('#msg'),!playing);
  show($('#actions'),showReady);
  $('#readyBtn').textContent=btn;
  show($('#soloBtn'),showSolo);
  show($('#cpuRow'),showSolo);
  var showRules=showReady&&!(S.phase==='result'&&S.solo);
  show($('#rulesRow'),showRules); show($('#rulesNote'),showRules);
  Array.prototype.forEach.call(document.querySelectorAll('[data-rules]'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-rules')===(S.rules||'ko')));});
  var ko=S.rules!=='classic', km=S.koMin==null?3:S.koMin;
  show($('#timeRow'),showRules&&ko);
  Array.prototype.forEach.call(document.querySelectorAll('[data-min]'),function(b){b.setAttribute('aria-pressed',String(+b.getAttribute('data-min')===km));});
  $('#rulesNote').textContent=!ko?'Top out once and you lose.':'Topping out costs a KO, not the match. First to 3 KOs'+(km?', or most KOs in '+km+' minutes.':' wins.');
  show($('#swipeRow'),showReady); show($('#soundRow'),showReady); soundNote(showReady);
  Array.prototype.forEach.call(document.querySelectorAll('[data-sound]'),function(b){b.setAttribute('aria-pressed',String((b.getAttribute('data-sound')==='1')===SFX.isOn()));});
  show($('#screenRow'),showReady&&room.tv);
  Array.prototype.forEach.call(document.querySelectorAll('[data-screen]'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-screen')===room.screen));});
  var wasHidden=$('#local').hidden, local=playing&&phoneMode();
  show($('#surface'),playing);
  show($('#surfHint'),!local); show($('#local'),local); surf.classList.toggle('local',local);
  show($('#hud'),local);
  if(local&&wasHidden)layoutLocal();
  $('#surfHint').textContent=S.phase==='countdown'?'Get ready':'Drag sideways to move. Tap to rotate. Flick down to drop. Flick up to hold.';
}
$('#readyBtn').addEventListener('click',function(){
  var now=!!(S.ready&&S.ready[seat]);
  if(S.phase==='result'&&S.solo){act({t:'ready',v:true,solo:true});return;}
  if(S.phase==='result'&&S.cpu&&S.cpu.seat!==seat&&!S.conn[1-seat]){act({t:'ready',v:true,cpu:S.cpu.level});return;}
  act({t:'ready',v:!now});
});
$('#soloBtn').addEventListener('click',function(){act({t:'ready',v:true,solo:true});});
Array.prototype.forEach.call(document.querySelectorAll('[data-screen]'),function(b){
  b.addEventListener('click',function(){sendMsg({t:'screen',v:b.getAttribute('data-screen')});});
});
Array.prototype.forEach.call(document.querySelectorAll('[data-rules]'),function(b){
  b.addEventListener('click',function(){act({t:'rules',v:b.getAttribute('data-rules')==='ko'});});
});
Array.prototype.forEach.call(document.querySelectorAll('[data-min]'),function(b){
  b.addEventListener('click',function(){act({t:'kotime',min:+b.getAttribute('data-min')});});
});
Array.prototype.forEach.call(document.querySelectorAll('[data-sound]'),function(b){
  b.addEventListener('click',function(){
    if((b.getAttribute('data-sound')==='1')!==SFX.isOn())SFX.toggle();
    SFX.init(); if(SFX.isOn())SFX.play('rotate',0); render();
  });
});
/* says when sound is not running yet, which is the usual reason a phone stays quiet */
function soundNote(visible){
  var st=SFX.state(), el=$('#soundNote'), txt='';
  if(SFX.isOn()&&st!=='running')txt=st==='none'?'Tap the screen once to start sound.':'Sound is paused ('+st+'). Tap the screen to start it.';
  else if(SFX.isOn())txt='Sound is on. Hear nothing? Turn the volume up, and on an iPhone check the silent switch.';
  el.textContent=txt; show(el,visible&&!!txt);
}
SFX.phone();
SFX.onchange=function(){soundNote(!$('#soundRow').hidden);};
function showSens(){$('#sens').value=sens;$('#sensTxt').textContent=SENS_NAMES[sens-1];}
$('#sens').addEventListener('input',function(){
  sens=+this.value; showSens(); vibe(8);
  try{localStorage.setItem('bd-swipe',String(sens));}catch(e){}
});
showSens();
Array.prototype.forEach.call(document.querySelectorAll('[data-cpu]'),function(b){
  b.addEventListener('click',function(){act({t:'ready',v:true,cpu:b.getAttribute('data-cpu')});});
});

/* ---------------------------------------------------------- phone mode */
/* With Screen set to Phones (always the case when no TV page is open) each phone shows and runs its own board. On its own a phone
   runs practice and computer matches entirely by itself (R below keeps score). In a two-phone match player 1's phone keeps score
   for both (ready, countdown, KOs, clock, wins) and sends that state to player 2; each phone plays its own board, and the two swap
   garbage, top-outs and small board snapshots through the server. */
var room={seats:[null,null],tv:false,screen:'tv'};
var hostS=null, G=null, opp=null, lastKos=null, snapAt=0;
function phoneMode(){return room.screen==='phone'||!!G||localLive();}   /* a game in progress on this phone carries on whatever the room switches to */
function peerOn(){var o=room.seats[seat===0?1:0];return !!(o&&o.connected);}
function relay(o){sendMsg({t:'p',m:o});}
function localLive(){return !!(R.match&&(R.phase==='countdown'||R.phase==='playing'));}
function guest(){return phoneMode()&&seat===1&&peerOn()&&!localLive();}
function currentState(){
  if(!phoneMode())return lastTv;
  if(guest())return hostS||refState();
  return refState();
}
function act(o){
  if(!phoneMode()){sendMsg(o);return;}
  if(guest())relay({k:'pad',o:o}); else refPad(seat,o);
}
function viewGame(){return G?G.game:(R.match&&R.games[seat])||null;}
function myGame(){
  if(G)return performance.now()>=G.t0?G.game:null;
  return R.match&&R.phase==='playing'?R.games[seat]:null;
}

/* the scorekeeper: the same flow as the TV page, for this phone's own matches and, on player 1's phone, two-phone matches */
var R={phase:'lobby',ready:[false,false],wins:[0,0],rules:'ko',koMin:3,match:null,games:[null,null],bots:[null,null],remoteSent:0,forfeit:0,kind:''};
try{
  if(localStorage.getItem('bd-rules')==='classic')R.rules='classic';
  var km=localStorage.getItem('bd-komin'); if(km!==null&&KO_MINUTES.indexOf(+km)>=0)R.koMin=+km;
}catch(e){}
function refConn(){var c=[false,false]; if(seat===0||seat===1){c[seat]=true;c[1-seat]=peerOn();} return c;}
function refState(){
  var m=R.match;
  return {phase:R.phase,ready:R.ready.slice(),conn:refConn(),wins:R.wins.slice(),winner:m?m.winner:null,solo:!!(m&&m.solo),
    cpu:m&&m.cpu!=null?{seat:m.cpu,level:m.level}:null,rules:R.rules,koMin:R.koMin,kos:m&&m.ko?m.kos.slice():null,
    seats:m?m.seats.filter(function(i){return i!==m.cpu;}):null};
}
function push(){
  render();
  if(phoneMode()&&seat===0&&peerOn()){
    var m=R.match, now=performance.now();
    relay({k:'state',s:refState(),seed:m?m.seed:0,cd:m?Math.max(0,m.t0-now):0,tl:m&&m.tEnd<Infinity?m.tEnd-now:-1});
  }
}
function refPad(from,o){
  if(R.phase!=='lobby'&&R.phase!=='result')return;
  if(o.t==='rules'){R.rules=o.v?'ko':'classic';try{localStorage.setItem('bd-rules',R.rules);}catch(e){} push();}
  else if(o.t==='kotime'){
    if(KO_MINUTES.indexOf(o.min)<0)return;
    R.koMin=o.min; try{localStorage.setItem('bd-komin',String(R.koMin));}catch(e){} push();
  }else if(o.t==='ready'){
    var c=refConn();
    if(from===seat&&o.solo&&!c[1-seat]){refStart([seat]);return;}
    if(from===seat&&o.cpu&&CPU[o.cpu]&&!c[1-seat]){refStart([0,1],{seat:1-seat,level:o.cpu});return;}
    R.ready[from]=!!o.v; push();
    if(c[0]&&c[1]&&R.ready[0]&&R.ready[1])refStart([0,1]);
  }
}
function refStart(list,cpu){
  var solo=list.length===1, now=performance.now(), remote=(!solo&&!cpu)?1-seat:null;
  var m=R.match={seats:list.slice(),solo:solo,seed:Math.floor(Math.random()*2147483647),t0:now+COUNTDOWN,winner:null,
    cpu:cpu?cpu.seat:null,level:cpu?cpu.level:null,ko:!solo&&R.rules==='ko',kos:[0,0],remote:remote,lastBeep:0};
  m.tEnd=m.ko&&R.koMin?m.t0+R.koMin*60000:Infinity;
  var kind=solo?R.kind:(cpu?'cpu-'+cpu.level:'pvp');   /* the score resets when you switch between a friend and the computer */
  if(kind!==R.kind){R.wins=[0,0];R.kind=kind;}
  R.games=[null,null]; R.bots=[null,null]; R.remoteSent=0; opp=null; G=null;
  list.forEach(function(i){
    if(i===remote)return;
    var g=R.games[i]=new Game(m.seed);
    if(m.cpu===i)R.bots[i]=new Bot(g,m.level);
    else g.sfx=function(n,a){SFX.play(n,0,a);};
    g.onSend=function(n){refSend(i,n);};
    g.onOver=function(){refTopOut(i);};
  });
  R.ready=[false,false]; R.phase='countdown';
  clearTimeout(R.forfeit); R.forfeit=0;
  push();
}
function refSend(from,n){
  var m=R.match, to=1-from; if(!m||m.solo)return;
  if(to===m.remote)relay({k:'atk',n:n});
  else if(R.games[to]&&!R.games[to].over)R.games[to].receive(n);
}
function refTopOut(i){
  var m=R.match; if(!m||(R.phase!=='playing'&&R.phase!=='countdown'))return;
  if(m.solo){refFinish(null);return;}
  var o=1-i;
  if(!m.ko){refFinish(o);return;}
  m.kos[o]++;
  if(m.kos[o]>=KO_TO_WIN){refFinish(o);return;}
  if(R.games[i])R.games[i].koUntil=performance.now()+KO_RESPAWN_MS;
  push();
}
function refFinish(w){
  if(R.phase==='result')return;
  R.phase='result'; R.match.winner=w;
  R.games.forEach(function(g){if(g)g.over=true;});
  if(w!==null&&w>=0)R.wins[w]++;
  SFX.play(w===seat?'win':'lose');
  R.ready=[false,false]; clearTimeout(R.forfeit); R.forfeit=0;
  push();
}
function refTimeUp(){
  var m=R.match, me=seat, o=1-seat, k=m.kos, w=k[0]>k[1]?0:k[1]>k[0]?1:-1;
  if(w<0){
    var a=R.games[me]?R.games[me].sent:0, b=R.games[o]?R.games[o].sent:R.remoteSent;
    w=a>b?me:b>a?o:-1;
  }
  refFinish(w);
}
function refTick(ts){
  var m=R.match; if(!m)return;
  if(R.phase==='countdown'){
    var left=m.t0-ts;
    if(left<=0){R.phase='playing';SFX.play('go');push();}
    else{var sec=Math.ceil(left/1000);if(m.lastBeep!==sec){m.lastBeep=sec;SFX.play('tick');}}
  }
  if(R.phase!=='playing')return;
  for(var i=0;i<2;i++){
    var g=R.games[i]; if(!g)continue;
    if(g.over&&g.koUntil&&ts>=g.koUntil)g.revive();
    if(!g.over){if(R.bots[i])R.bots[i].tick(ts);if(!g.over)g.tick(ts,m.t0);}
  }
  if(R.phase==='playing'&&ts>=m.tEnd)refTimeUp();
}

/* player 2's side of a two-phone match: play the board locally, follow player 1's state */
function guestSync(o){
  var s=o.s, mine=!!(s.seats&&s.seats.indexOf(seat)>=0&&!s.solo&&!s.cpu), live=s.phase==='countdown'||s.phase==='playing';
  if(mine&&live){
    var now=performance.now();
    if(!G||G.seed!==o.seed){
      var g=new Game(o.seed);
      G={game:g,seed:o.seed,t0:now+(+o.cd||0),tEnd:Infinity,lastBeep:0,went:false};
      opp=null;
      g.sfx=function(n,a){SFX.play(n,0,a);};
      g.onSend=function(n){relay({k:'atk',n:n});};
      g.onOver=function(){relay({k:'ko'}); if(hostS&&hostS.rules==='ko')g.koUntil=performance.now()+KO_RESPAWN_MS;};
    }
    if(s.phase==='countdown')G.t0=now+(+o.cd||0);
    G.tEnd=o.tl>=0?now+o.tl:Infinity;
  }else if(G&&!live){
    G.game.over=true; G=null;
    SFX.play(s.winner===seat?'win':'lose');
  }
}
function guestTick(ts){
  var g=G.game, left=G.t0-ts;
  if(left>0){var sec=Math.ceil(left/1000);if(G.lastBeep!==sec){G.lastBeep=sec;SFX.play('tick');}return;}
  if(!G.went){G.went=true;SFX.play('go');}
  if(g.over&&g.koUntil&&ts>=g.koUntil)g.revive();
  if(!g.over)g.tick(ts,G.t0);
}

/* messages between the two phones */
function onPeer(from,o){
  if(!o||typeof o!=='object'||!phoneMode())return;
  if(o.k==='state'&&seat===1&&o.s&&typeof o.s==='object'){hostS=o.s; guestSync(o); render();}
  else if(o.k==='hello'&&seat===0)push();
  else if(o.k==='pad'&&seat===0&&o.o&&typeof o.o==='object')refPad(from,o.o);
  else if(o.k==='atk'){var g=myGame()||viewGame(); if(g&&!g.over)g.receive(Math.max(0,Math.min(GARBAGE_CAP,o.n|0)));}
  else if(o.k==='ko'&&seat===0&&R.match&&R.match.remote===from)refTopOut(from);
  else if(o.k==='snap'){opp=o; if(seat===0&&R.match&&R.match.remote===from)R.remoteSent=o.sent|0;}
}
function onRoom(m){
  var wasScreen=room.screen, wasPeer=peerOn();
  room={seats:Array.isArray(m.seats)?m.seats:[null,null],tv:!!m.tv,screen:m.screen==='phone'?'phone':'tv'};
  var peer=peerOn(), fresh=peer&&(!wasPeer||wasScreen!=='phone');
  if(phoneMode()){
    if(seat===1){
      if(fresh)relay({k:'hello'});
      if(!peer){G=null;hostS=null;}
    }
    if(seat===0){
      if(!peer)R.ready[1]=false;
      var m2=R.match, pvpLive=m2&&m2.remote!=null&&localLive();
      if(pvpLive&&!peer&&!R.forfeit)R.forfeit=setTimeout(function(){R.forfeit=0;if(localLive()&&!peerOn())refFinish(seat);},FORFEIT_MS);
      else if(peer&&R.forfeit){clearTimeout(R.forfeit);R.forfeit=0;}
      if(fresh){push();return;}
    }
  }else G=null;
  render();
}

/* the board view */
var cvMy=$('#myBoard'), cvHold=$('#myHold'), cvNext=$('#myNext'), cvOpp=$('#oppBoard'), lcs=20, lns=11, ocs=8, hudTxt='';
function layoutLocal(){
  var r=surf.getBoundingClientRect(); if(!r.width)return;
  var railW=84, W=r.width-16-railW-10, H=r.height-16;
  lcs=Math.max(10,Math.floor(Math.min(H/ROWS,W/COLS)));
  setCanvas(cvMy,COLS*lcs,ROWS*lcs);
  lns=Math.max(7,Math.min(Math.floor(lcs*0.55),Math.floor(railW/4.5)));
  setCanvas(cvHold,railW,lns*3); setCanvas(cvNext,railW,lns*6);
  ocs=Math.floor(railW/COLS); setCanvas(cvOpp,COLS*ocs,ROWS*ocs);
}
function snapOf(g){
  var grid=g.board.map(function(row){return row.slice();}), cur=g.cur, r, c, b='';
  if(cur&&!g.over)for(r=0;r<cur.m.length;r++)for(c=0;c<cur.m[r].length;c++)if(cur.m[r][c]&&cur.y+r>=0)grid[cur.y+r][cur.x+c]=IDS[cur.t];
  for(r=0;r<ROWS;r++)b+=grid[r].join('');
  return {k:'snap',b:b,p:g.pending,a:g.armed(),sent:g.sent,ko:!!(g.over&&g.koUntil)};
}
function snapView(o){
  var board=[], r, c;
  for(r=0;r<ROWS;r++){var row=[];for(c=0;c<COLS;c++)row.push(Math.min(8,+o.b.charAt(r*COLS+c)||0));board.push(row);}
  return {board:board,cur:null,over:!!o.ko,koUntil:o.ko?1:0,pending:Math.max(0,o.p|0),armed:function(){return Math.max(0,o.a|0);},fx:null};
}
function drawLocal(ts){
  var g=viewGame(); if(!g)return;
  drawBoard(cvMy,g,lcs); if(g.over&&g.koUntil)drawKO(cvMy,lcs);
  drawHold(cvHold,g,lns); drawNext(cvNext,g,lns,2);
  $('#myLines').textContent=g.lines; $('#mySent').textContent=g.sent;
  var m=R.match, og=null, two=G||(m&&!m.solo);
  if(!G&&m&&m.cpu!=null)og=R.games[m.cpu];
  else if(opp&&typeof opp.b==='string'&&opp.b.length===ROWS*COLS)og=snapView(opp);
  $('#oppBox').hidden=!two;
  if(two){
    $('#oppName').textContent=!G&&m&&m.cpu!=null?'CPU':'Player '+(seat===0?2:1);
    if(og){drawBoard(cvOpp,og,ocs); if(og.over&&og.koUntil)drawKO(cvOpp,ocs);} else drawEmptyBoard(cvOpp);
  }
  var t0=G?G.t0:(m?m.t0:0), left=t0-ts, cd=$('#cdNum');
  cd.hidden=left<=0; if(left>0)cd.textContent=Math.ceil(left/1000);
  var tEnd=G?G.tEnd:(m?m.tEnd:Infinity), kos=S.kos, txt='';
  if(kos)txt+='KO '+kos[seat]+'–'+kos[seat===0?1:0];
  if(tEnd<Infinity){var rem=Math.min(tEnd-ts,tEnd-Math.max(ts,t0)), sec=Math.max(0,Math.ceil(rem/1000));txt+=(txt?'|':'')+(rem<=30000?'!':'')+Math.floor(sec/60)+':'+('0'+sec%60).slice(-2);}
  if(txt!==hudTxt){
    hudTxt=txt;
    $('#hud').innerHTML=txt.split('|').map(function(x){return x.charAt(0)==='!'?'<span class="low">'+x.slice(1)+'</span>':'<span>'+x+'</span>';}).join('');
  }
}
function loop(ts){
  if(phoneMode()){
    if(R.match)refTick(ts);
    if(G)guestTick(ts);
    if(!$('#local').hidden)drawLocal(ts);
    var mine=G?G.game:(R.match&&R.match.remote!=null&&R.phase==='playing'?R.games[seat]:null);
    if(mine&&ts-snapAt>=100){snapAt=ts;relay(snapOf(mine));}
  }
  requestAnimationFrame(loop);
}


/* ---------------------------------------------------------- swipe */
var surf=$('#surface'), flashEl=$('#flash'), sw=null, flashT=0;
function flash(txt){
  flashEl.textContent=txt; flashEl.className='show';
  clearTimeout(flashT);
  flashT=setTimeout(function(){flashEl.className='fade';},60);
}
surf.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{surf.setPointerCapture(e.pointerId);}catch(x){}
  surf.classList.add('touch');
  var now=performance.now();
  sw={id:e.pointerId,x0:e.clientX,y0:e.clientY,ax:e.clientX,ay:e.clientY,t0:now,mode:'',hist:[{t:now,y:e.clientY}]};
});
surf.addEventListener('pointermove',function(e){
  if(!sw||e.pointerId!==sw.id)return;
  var now=performance.now();
  sw.hist.push({t:now,y:e.clientY});
  while(sw.hist.length>2&&now-sw.hist[0].t>160)sw.hist.shift();
  if(!sw.mode){
    var tx=e.clientX-sw.x0, ty=e.clientY-sw.y0;
    if(Math.hypot(tx,ty)<14)return;
    sw.mode=(Math.abs(ty)>Math.abs(tx)*1.15)?'v':'h';
    if(sw.mode==='v'){sw.ax=e.clientX; sw.ay=e.clientY;}   /* sideways drags keep counting from the touch-down point, so the first step is not delayed */
  }
  var hs=26*sensK(), vs=34*sensK();
  var dx=e.clientX-sw.ax, dy=e.clientY-sw.ay;
  if(sw.mode==='h'){
    while(dx>=hs){key('R');sw.ax+=hs;dx-=hs;}
    while(dx<=-hs){key('L');sw.ax-=hs;dx+=hs;}
  }
  while(dy>=vs){key('D');sw.ay+=vs;dy-=vs;}
  if(dy<0)sw.ay=e.clientY;   /* going up re-anchors, so soft drops count from the highest point */
});
function swEnd(e){
  surf.classList.remove('touch');
  if(!sw||e.pointerId!==sw.id)return;
  var s=sw; sw=null;
  if(e.type==='pointercancel')return;
  var dx=e.clientX-s.x0, dy=e.clientY-s.y0, dt=Math.max(1,performance.now()-s.t0);
  if(Math.hypot(dx,dy)<12&&dt<300){key('U');hint('Turn');return;}
  var h0=s.hist[0], vy=(e.clientY-h0.y)/Math.max(1,performance.now()-h0.t);
  var k=sensK();
  if(s.mode==='v'&&dy>60*k&&vy>0.65*k){key('H');hint('Drop');}
  else if(s.mode==='v'&&dy<-60*k&&vy<-0.55*k){key('C');hint('Hold');}
}
surf.addEventListener('pointerup',swEnd);
surf.addEventListener('pointercancel',swEnd);
surf.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

window.addEventListener('resize',function(){if(!$('#local').hidden)layoutLocal();});
render();
connect();
requestAnimationFrame(loop);
window.BDP={get R(){return R;},get G(){return G;},get room(){return room;},get S(){return S;}};
})();
</script>
</body>
